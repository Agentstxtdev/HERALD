<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="4" fill="#111"/>

  <!-- antennae -->
  <path d="M16 3v3M22 3v3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- agent head (the routing destination) -->
  <rect x="12" y="6" width="14" height="13" rx="3" stroke="#fff" stroke-width="1.4" fill="none"/>

  <!-- eyes -->
  <circle cx="16" cy="11" r="1.3" fill="#fff"/>
  <circle cx="22" cy="11" r="1.3" fill="#fff"/>

  <!-- mouth -->
  <path d="M16 15h6" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>

  <!-- traefik-style convergence: three routes meeting at the head's left edge -->
  <path d="M3 9l9 3.5M3 12.5h9M3 16l9-3.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- output arrow exiting the head (routed forward) -->
  <path d="M26 12.5h3.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M28 11l1.6 1.5-1.6 1.5" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- legs / footprint -->
  <path d="M16 19v3M22 19v3" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M14.5 22h3M20.5 22h3" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
