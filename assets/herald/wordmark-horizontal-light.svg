<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240">
  <g transform="translate(0 20) scale(0.78125 0.78125)" data-symbol="herald-mark">
      <!-- mouthpiece (left) -->
      <rect x="14" y="100" width="14" height="20" rx="2" fill="#15161a" />
      <!-- mouthpiece cup -->
      <rect x="26" y="104" width="6" height="12" fill="#15161a" />

      <!-- main tube of the trumpet -->
      <rect x="32" y="106" width="120" height="8" fill="#15161a" />

      <!-- middle valve ring -->
      <rect x="92" y="100" width="6" height="20" fill="#15161a" />

      <!-- bell taper (trapezoid) - flares to the right -->
      <path d="M152 96 L210 70 L210 150 L152 124 Z" fill="#15161a" />

      <!-- bell rim (right edge, slightly thicker line via shape) -->
      <rect x="206" y="68" width="10" height="84" fill="#15161a" />

      <!-- cord attaching banner to trumpet (left + right vertical lines) -->
      <rect x="56" y="114" width="2" height="14" fill="#15161a" />
      <rect x="138" y="114" width="2" height="14" fill="#15161a" />

      <!-- BANNER (gonfalon) - hangs below the trumpet
           Square with swallow-tail bottom cut. -->
      <path d="
        M50 126
        L146 126
        L146 206
        L122 192
        L98 206
        L74 192
        L50 206
        Z
      " fill="#15161a" />

      <!-- ROBOT FACE — knocked out of the banner via cream-colored shapes.
           We use a class so we can switch knockout color per variant. -->
      <g class="face-knockout">
        <!-- antenna stem (top of banner, extends slightly above) -->
        <rect x="96" y="118" width="4" height="10" fill="#f2ede3" />
        <rect x="96" y="118" width="4" height="10" fill="#f2ede3" />
        <!-- antenna ball -->
        <rect x="92" y="114" width="12" height="4" fill="#f2ede3" />

        <!-- left eye -->
        <rect x="72" y="146" width="18" height="18" fill="#f2ede3" />
        <!-- right eye -->
        <rect x="106" y="146" width="18" height="18" fill="#f2ede3" />

        <!-- mouth: 4 small teeth slit -->
        <rect x="74" y="174" width="6" height="4" fill="#f2ede3" />
        <rect x="84" y="174" width="6" height="4" fill="#f2ede3" />
        <rect x="94" y="174" width="6" height="4" fill="#f2ede3" />
        <rect x="104" y="174" width="6" height="4" fill="#f2ede3" />
        <rect x="114" y="174" width="6" height="4" fill="#f2ede3" />
      </g>
